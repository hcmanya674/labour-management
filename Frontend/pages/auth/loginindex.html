<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Labour Management System</title>

    <link
        rel="stylesheet"
        href="../../css/style.css"
    >

    <!-- PWA -->
    <link
        rel="manifest"
        href="../../manifest.json"
    >

    <meta
        name="theme-color"
        content="#1a73e8"
    >

</head>

<body>

<!-- =================================================
     SPLASH SCREEN
================================================= -->

<div id="splashScreen">

    <img
        src="../../images/labourproject.png"
        class="install-icon"
        alt="Labour Management"
    >

    <h2>
        Labour Management System
    </h2>

</div>


<!-- =================================================
     INSTALL BANNER
================================================= -->

<div
    id="installBanner"
    class="install-banner"
    style="display:none;"
>

    <div class="install-left">

        <img
            src="../../images/labourproject.png"
            class="install-icon"
            alt="Labour Management"
        >

        <div class="install-text">

            <h1>
                Labour Management
            </h1>

            <h2>
                Install this App
            </h2>

        </div>

    </div>


    <button
        id="installBtn"
        type="button"
    >
        Install
    </button>

</div>


<!-- =================================================
     LOGIN PAGE
================================================= -->

<div
    id="loginPage"
    class="login-page"
>

    <div class="login-box">

        <h1>
            Labour Management
        </h1>

        <p>
            Please login to continue
        </p>


        <form id="loginForm">

            <input
                type="email"
                id="userid"
                placeholder="Email"
                autocomplete="username"
            >


            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
            >


            <button
                type="submit"
                id="loginBtn"
            >
                Log In
            </button>


            <p
                style="
                    margin-top:15px;
                    text-align:center;
                "
            >

                <a
                    href="#"
                    id="forgotPasswordLink"
                >
                    Forgot Password?
                </a>

            </p>

        </form>


        <p id="message"></p>

    </div>

</div>


<!-- =================================================
     FIREBASE
================================================= -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>


<!-- =================================================
     YOUR COMMON FILES
================================================= -->

<script src="../../js/common/firebase.js"></script>

<script src="../../js/common/script.js"></script>

<script src="../../js/common/api.js"></script>

</body>

</html>
