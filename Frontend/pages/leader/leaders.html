<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leader Dashboard</title>

<link rel="stylesheet" href="../../css/style.css">

</head>

<body>
    <div class="container leader-dashboard">

    <!-- Sidebar -->

    <div class="sidebar">

        <h2>Leader Panel</h2>

        <button onclick="showDashboard()">
            🏠 Dashboard
        </button>

        <button onclick="showCreateRO()">
            📋 Create RO
        </button>

        <button onclick="showRepairOrders()">
            📑 Repair Orders
        </button>

        <button onclick="logout()">
            ↪ Logout
        </button>

    </div>

<div class="main">

    <div class="leader-header">

        <h2 id="leaderName">
            WELCOME
        </h2>

        <h3 id="leaderRegion">
            REGION
        </h3>

    </div>


    <div class="cards">

        <div class="card today-card">

            <div class="today-icon">
                📋
            </div>

            <div class="today-info">

                <h1 id="todayCount">
                    0
                </h1>

                <p>
                    Today's Repair Orders
                </p>

            </div>

        </div>

    </div>


    <div class="leader-actions">

        <button
            onclick="location='../../pages/leader/repairOrders.html'"
            class="leader-action-btn"
        >
            📋
            <span>Repair Orders</span>
            <strong>›</strong>
        </button>


        <button
            onclick="showCreateRO()"
            class="leader-action-btn"
        >
            ＋
            <span>Create Repair Order</span>
            <strong>›</strong>
        </button>

    </div>

</div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="../../js/common/firebase.js"></script>
<script src="../../js/common/leader-common.js"></script>
<script src="../../js/leader/leaders.js"></script>

</body>

</html>
