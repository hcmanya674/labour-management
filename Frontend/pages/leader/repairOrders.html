<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Repair Orders</title>

    <link
        rel="stylesheet"
        href="../../css/style.css"
    >

</head>


<body>

    <div class="repair-orders-page">


        <!-- =====================================
             HOME BUTTON
             ===================================== -->

        <button
            class="repair-home-btn"
            onclick="goToLeaderDashboard()"
        >
            🏠 Home
        </button>


        <!-- =====================================
             PAGE TITLE
             ===================================== -->

        <h1>
            Repair Orders
        </h1>


        <!-- =====================================
             FILTER SECTION
             ===================================== -->

        <div class="repair-filter-section">


            <div class="ro-filter-box">


                <!-- MONTH -->

                <div class="month-filter">

                    <label for="monthFilter">
                        Select Month:
                    </label>

                    <select
                        id="monthFilter"
                        onchange="loadRepairOrders()"
                    >
                    </select>

                </div>


                <!-- DELETE -->

                <button
                    class="delete-selected-btn"
                    id="deleteSelectedBtn"
                    onclick="deleteSelectedROs()"
                    disabled
                >
                    🗑 Delete Selected
                </button>


            </div>


            <!-- =====================================
                 STATUS
                 ===================================== -->

            <div
                id="roStatus"
                class="ro-status"
            >
                Loading Repair Orders...
            </div>


            <!-- =====================================
                 TABLE
                 ===================================== -->

            <div class="repair-table-wrapper">


                <table id="repairOrderTable">


                    <thead>

                        <tr>

                            <th>

                                <input
                                    type="checkbox"
                                    id="selectAllRO"
                                    onchange="toggleSelectAll(this)"
                                >

                            </th>


                            <th>
                                RO No
                            </th>


                            <th>
                                Date
                            </th>


                            <th>
                                Vehicle
                            </th>


                            <th>
                                Advisor
                            </th>


                            <th>
                                Item Code
                            </th>


                            <th>
                                Work Done
                            </th>


                            <th>
                                Billing Amount
                            </th>


                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody id="repairOrderBody">

                    </tbody>


                </table>

            </div>


        </div>


    </div>
    <!-- END repair-orders-page -->


    <!-- =====================================
         FIREBASE
         ===================================== -->

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>


    <!-- =====================================
         FIREBASE CONFIG
         ===================================== -->

    <script src="../../js/common/firebase.js"></script>


    <!-- =====================================
         COMMON LEADER CODE
         ===================================== -->

    <script src="../../js/common/leader-common.js"></script>


    <!-- =====================================
         REPAIR ORDERS JS
         ===================================== -->

    <script src="../../js/leader/repairOrders.js"></script>


</body>

</html>
