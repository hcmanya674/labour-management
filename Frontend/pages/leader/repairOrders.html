<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>Repair Orders</title>

    <link
        rel="stylesheet"
        href="../../css/style.css"
    >

</head>

<body>

    <br>

    <button
        class="home-btn"
        onclick="goToLeaderDashboard()"
    >
        🏠 Home
    </button>

    <br>

    <h2>Repair Orders</h2>

    <br>

    <div class="container">

        <!-- =====================================
             FILTER SECTION
             ===================================== -->

        <div class="ro-filter-box">

            <label for="monthFilter">
                Select Month:
            </label>

            <select
                id="monthFilter"
                onchange="loadRepairOrders()"
            >
            </select>

            <button
                class="delete-selected-btn"
                id="deleteSelectedBtn"
                onclick="deleteSelectedROs()"
                disabled
            >
                🗑 Delete Selected
            </button>

        </div>


        <!-- =====================================
             STATUS
             ===================================== -->

        <div
            id="roStatus"
            class="ro-status"
        >
            Loading Repair Orders...
        </div>


        <!-- =====================================
             TABLE
             ===================================== -->

        <div class="table-card">

            <table id="roTable">

                <thead>

                    <tr>

                        <th>
                            <input
                                type="checkbox"
                                id="selectAllRO"
                                onchange="toggleSelectAll(this)"
                            >
                        </th>

                        <th>RO No</th>

                        <th>Date</th>

                        <th>Vehicle</th>

                        <th>Advisor</th>

                        <th>Item Code</th>

                        <th>Work Done</th>

                        <th>Billing Amount</th>

                        <th>Action</th>

                    </tr>

                </thead>

                <tbody>

                </tbody>

            </table>

        </div>

    </div>


    <!-- =====================================
         FIREBASE
         ===================================== -->

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>


    <!-- Firebase Config -->

    <script src="../../js/common/firebase.js"></script>


    <!-- Common Leader Code -->

    <script src="../../js/common/leader-common.js"></script>


    <!-- Repair Orders -->

    <script src="../../js/leader/repairOrders.js"></script>

</body>

</html>
