<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>Repair Order Details</title>

    <link
        rel="stylesheet"
        href="../../css/style.css"
    >

</head>


<body>


<div class="container">


    <!-- =====================================
         MAIN
         NO SIDEBAR
         ===================================== -->

    <div class="main">


        <!-- =================================
             HOME BUTTON
             ================================= -->

        <button
            type="button"
            class="view-home-btn"
            onclick="goToLeaderDashboard()"
        >
            🏠 Home
        </button>


        <!-- =================================
             PAGE TITLE
             ================================= -->

        <h2>
            View Repair Order Details
        </h2>


        <div class="form-box">


            <!-- =================================
                 RO NUMBER
                 ================================= -->

            <div class="row">

                <label>
                    RO Number
                </label>

                <span id="roNumber">
                    -
                </span>

            </div>


            <!-- =================================
                 DATE
                 ================================= -->

            <div class="row">

                <label>
                    Date
                </label>

                <span id="createdDate">
                    -
                </span>

            </div>


            <!-- =================================
                 VEHICLE NUMBER
                 ================================= -->

            <div class="row">

                <label>
                    Vehicle Number
                </label>

                <input
                    type="text"
                    id="vehicleNumber"
                    disabled
                >

            </div>


            <!-- =================================
                 ADVISOR NAME
                 ================================= -->

            <div class="row">

                <label>
                    Advisor Name
                </label>

                <input
                    type="text"
                    id="advisorName"
                    disabled
                >

            </div>


            <!-- =================================
                 ITEM CODES
                 ================================= -->

            <div class="row">

                <label>
                    Item Codes
                </label>


                <div
                    id="itemCodeContainer"
                    class="item-code-container"
                >

                    Loading items...

                </div>


                <small>
                    Select one or more item codes.
                </small>

            </div>


            <!-- =================================
                 BUTTONS
                 ================================= -->

            <div class="view-ro-buttons">


                <!-- ONE BUTTON:
                     EDIT → UPDATE -->

                <button
                    type="button"
                    id="actionBtn"
                    class="edit-btn"
                    onclick="enableEdit()"
                >
                    Edit
                </button>


                <!-- BACK -->

                <button
                    type="button"
                    class="back-btn"
                    onclick="history.back()"
                >
                    Back
                </button>


            </div>


        </div>


    </div>


</div>



<!-- =====================================
     FIREBASE
     ===================================== -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>


<!-- =====================================
     FIREBASE CONFIGURATION
     ===================================== -->

<script src="../../js/common/firebase.js"></script>


<!-- =====================================
     LEADER COMMON
     ===================================== -->

<script src="../../js/common/leader-common.js"></script>


<!-- =====================================
     VIEW RO JAVASCRIPT
     ===================================== -->

<script src="../../js/leader/viewRO.js"></script>


<!-- =====================================
     HOME FUNCTION
     ===================================== -->

<script>

function goToLeaderDashboard() {

    window.location.href = "leaders.html";

}

</script>


</body>

</html>
