<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Create Repair Order</title>

<link rel="stylesheet" href="../../css/style.css">

</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <div class="sidebar">

        <h2>Leader Panel</h2>

        <button onclick="showDashboard()">Dashboard</button>

        <button onclick="showCreateRO()">Create RO</button>

        <button onclick="showRepairOrders()">Repair Orders</button>

        <button onclick="logout()">Logout</button>

    </div>

    <!-- Main -->

    <div class="main">

        <h2>Create Repair Order</h2>

        <div class="form-box">

            <label>Leader Name</label>

            <input
                type="text"
                id="leaderName"
                readonly>

            <label>Region</label>

            <input
                type="text"
                id="region"
                readonly>
           <label>RO Number</label>
            <input
                type="text"
                id="roNumber"
                placeholder="Enter RO Number">
            <label>Vehicle Number</label>

            <input
                type="text"
                id="vehicleNumber"
                placeholder="Enter Vehicle Number">

            <label>Advisor Name</label>

            <input type="text"
                 id="advisorName"
                 placeholder="Enter Advisor Name"
                 maxlength="20">


           <label>Item Codes</label>

<div id="itemCodeContainer" class="item-code-container">
    Loading items...
</div>

<select id="itemCode" multiple size="5">
    <option value="">-- Select Item Codes --</option>
</select>

<small>
    Hold Ctrl (Windows) or Command (Mac) to select multiple items.
</small>

            <br><br>

            <button id="saveBtn" onclick="saveRO()">
            Save Repair Order
            </button>

        </div>

    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="../../js/common/firebase.js"></script>

<script src="../../js/common/leader-common.js"></script>

<script src="../../js/leader/createRO.js"></script>

</body>

</html>
