<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Create Repair Order</title>

    <link
        rel="stylesheet"
        href="../../css/style.css"
    >

</head>

<body>

<div class="create-ro-page">

    <!-- ==========================================
         TOP BUTTONS
    =========================================== -->

    <div class="create-ro-top-buttons">

        <!-- HOME -->

        <button
            type="button"
            class="create-ro-home"
            onclick="showDashboard()"
        >
            🏠 Home
        </button>


        <!-- LOGOUT -->

        <button
            type="button"
            class="create-ro-logout"
            onclick="logout()"
        >
            🚪 Logout
        </button>

    </div>


    <!-- ==========================================
         MAIN
    =========================================== -->

    <div class="create-ro-main">

        <h2>
            Create Repair Order
        </h2>


        <div class="form-box">


            <!-- =====================================
                 LEADER NAME
            ====================================== -->

            <label>
                Leader Name
            </label>

            <input
                type="text"
                id="leaderName"
                readonly
            >


            <!-- =====================================
                 REGION
            ====================================== -->

            <label>
                Region
            </label>

            <input
                type="text"
                id="region"
                readonly
            >


            <!-- =====================================
                 RO NUMBER - OPTIONAL
            ====================================== -->

            <label>
                RO Number
                <span style="font-weight:normal;">
                    (Optional)
                </span>
            </label>

            <input
                type="text"
                id="roNumber"
                placeholder="Enter RO Number (Optional)"
            >


            <!-- =====================================
                 VEHICLE NUMBER
            ====================================== -->

            <label>
                Vehicle Number
            </label>

            <input
                type="text"
                id="vehicleNumber"
                placeholder="Enter Vehicle Number"
            >


            <!-- =====================================
                 ADVISOR NAME
            ====================================== -->

            <label>
                Advisor Name
            </label>

            <input
                type="text"
                id="advisorName"
                placeholder="Enter Advisor Name"
                maxlength="30"
            >

<!-- =====================================
     ITEM CODES
====================================== -->

<label>
    Item Codes
</label>

<div class="item-selection-box">

    <!-- =================================
         SEARCH AREA
    ================================== -->

    <div class="item-search-area">

        <input
            type="text"
            id="itemSearchInput"
            placeholder="Search item code or description"
            autocomplete="off"
        >

        <div class="item-search-buttons">

            <button
                type="button"
                id="itemSearchBtn"
                onclick="searchItems()"
            >
                Search
            </button>

            <button
                type="button"
                id="itemClearBtn"
                onclick="clearItemSearch()"
            >
                Clear
            </button>

        </div>

    </div>


    <!-- =================================
         SEARCH MESSAGE
    ================================== -->

    <div
        id="itemSearchMessage"
        class="item-search-message"
    ></div>


    <!-- =================================
         ITEM LIST
    ================================== -->

    <div
        id="itemCodeContainer"
        class="item-code-container"
    >
        Loading items...
    </div>

</div>


<small>
    Select one or more item codes.
</small>


            <br>
            <br>


            <!-- =====================================
                 BILLING
            ====================================== -->

            <div class="billing-box">

                <strong>
                    Total Billing Amount:
                </strong>

                <span id="totalBillingAmount">
                    ₹0.00
                </span>

            </div>


            <br>
            <br>


            <!-- =====================================
                 SAVE BUTTON
            ====================================== -->

            <button
                type="button"
                id="saveBtn"
                onclick="saveRO()"
            >
                Save Repair Order
            </button>


        </div>

    </div>

</div>


<!-- ==========================================
     FIREBASE
=========================================== -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>


<!-- ==========================================
     COMMON FILES
=========================================== -->

<script src="../../js/common/firebase.js"></script>

<script src="../../js/common/leader-common.js"></script>

<script src="../../js/leader/createRO.js"></script>


</body>

</html>
