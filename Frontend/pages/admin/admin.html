<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"content="width=device-width,initial-scale=1.0">

<title>Admin Dashboard</title>

<link rel="stylesheet" href="../../css/style.css">

</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <div class="sidebar">

        <h2>Admin Panel</h2>

        <button onclick="showDashboard()">Dashboard </button>
        <button onclick="showRegions()">Region Management  </button>
        <button onclick="showItemCodes()"> Item Codes </button>
        <button onclick="showLeaders()">Leader Management</button>
        <button onclick="showReports()">Reports</button>
         <button onclick="logout()"> Logout
         </button>

    </div>

    <!-- Main -->

    <div class="main">

        <h1>Dashboard</h1>

        <div class="cards">

            <div class="card">

                <span id="regionCount"></span>

                <p>Regions</p>

            </div>

            <div class="card">

                <span id="leaderCount"></span>

                <p>Leaders</p>

            </div>
             <div class="card">

                <span id="itemCount">0</span>

                <p>Item Codes</p>

            </div>
           

        </div>

    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="../../js/common/firebase.js"></script>
<script src="../../js/common/admin-common.js"></script>
<script src="../../js/admin/admin-layout.js"></script>
<script src="../../js/admin/admin.js"></script>

</body>

</html>
