<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Assign Items to Leader</title>

    <link rel="stylesheet" href="../../css/style.css">

    <style>

    </style>

</head>

<body>

<div class="assignment-page">

    <!-- ================= TOP BAR ================= -->

    <div class="assignment-header">
         <button
            type="button"
            class="assignment-home-btn"
            onclick="goToAdminDashboard()"
        >
            🏠Go to Home Page
        </button>
        <br><br>
        <h2 class="page-title">
            Assign Items to Leader
        </h2>


    </div>


    <!-- ================= LEADER SELECTION ================= -->

    <div class="assignment-card">
        <div class="section-title"></div>
        <h3>Select Leader</h3>

        <select
            id="leaderSelect"
            class="leader-select"
            onchange="loadLeaderAssignments()">

            <option value="">
                Select Leader
            </option>

        </select>

    </div>


    <!-- ================= ITEMS ================= -->

    <div class="assignment-card">

        <div class="items-header">
            <div>
            <h3>
                Available Items
            </h3>
             <p class="items-subtitle">
                    Select the items that should be assigned
                    to this leader.
                </p>

            </div>
            <span
                id="itemCount"
                class="item-count">

                0 Items

            </span>

        </div>


         <div
            id="itemContainer"
            class="item-container"
        >

            <div class="empty-message">

                Select a leader to view available items.

            </div>

        </div>


        <!-- ================= SAVE ================= -->
          <p
            id="assignmentStatus"
            class="assignment-status"
        ></p>
        <button
            id="saveAssignmentBtn"
            class="save-btn"
            onclick="saveAssignments()"
            disabled>

            Save Assignment

        </button>

    </div>
<!-- =====================================================
     ASSIGNMENT OVERVIEW
===================================================== -->

<div class="assignment-card assignment-overview-card">

    <div class="items-header">

        <div>

            <h2>
                Assignment Overview
            </h2>

            <p class="items-subtitle">
                View which items are assigned to each leader.
            </p>

        </div>

    </div>


    <!-- Summary -->

    <div
        id="assignmentOverviewSummary"
        class="assignment-overview-summary"
    >
        Loading assignments...
    </div>


    <!-- Leader assignment cards -->

    <div
        id="assignmentOverview"
        class="assignment-overview"
    >

    </div>

</div>
</div>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>


<!-- Your Firebase -->

<script src="../../js/common/firebase.js"></script>


<!-- Assignment JS -->

<script src="../../js/admin/assignItems.js"></script>

</body>

</html>
