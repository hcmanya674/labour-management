<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Code Management</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
<button onclick="window.location.href='admin.html'" class="home-btn">🏠 Go to Home Page</button> 

<div class="container">

    <!-- Sidebar -->
    

    <!-- Main -->
    <div class="main">

        <h1>Item Code Management</h1>

        <div class="form-box">

            <label>Item Code</label>
            <input type="text" 
                id="itemCode" 
                maxlength="10"  
                placeholder="ENTER ITEM CODE" 
                style="text-transform:uppercase;">

            <label>Description</label>
            <input type="text" 
                id="itemDescription" 
                maxlength="40"  
                placeholder="ENTER DESCRIPTION" 
                style="text-transform:uppercase;">
            <label>Billing Amount</label>
            <input
                type="number"
                id="itemBillingAmount"
                placeholder="ENTER BILLING AMOUNT"
                min="0"
                step="0.01">

            <label>Incentive Amount</label>

            <input
                type="number"
                id="itemIncentiveAmount"
                placeholder="ENTER INCENTIVE AMOUNT"
                min="0"
                step="0.01">
            <button onclick="saveItem()">Save Item Code</button>

        </div>

        <br>

        <input
            type="text"
            id="searchItem"
            placeholder="Search Item Code or Description">

        <div
            id="itemMessage"
            style="color:red;font-weight:bold;margin-top:5px;">
        </div>

        <br><br>

        <table id="itemTable">

            <tr>
                <th>Item Code</th>
                <th>Description</th>
                <th>Status</th>
                <th>Edit</th>
                  <th>Edit Cost</th>
                <th>Deactivate</th>
                <th>Activate</th>
            </tr>

        </table>

    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="../../js/common/firebase.js"></script>
<script src="../../js/common/admin-common.js"></script>
<script src="../../js/admin/item.js?v=2"></script>

</body>
</html>
