<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Item Code Management</title>

    <link
        rel="stylesheet"
        href="../../css/style.css"
    >

</head>

<body>

<button
    onclick="window.location.href='admin.html'"
    class="home-btn"
>
    🏠 Home
</button>


<div class="container">

    <div class="main">

        <h1>Item Code Management</h1>


        <!-- ==========================================
             CREATE ITEM
        =========================================== -->

        <div class="form-box">

            <label>
                Description
            </label>

            <input
                type="text"
                id="itemDescription"
                maxlength="40"
                placeholder="ENTER DESCRIPTION"
                style="text-transform:uppercase;"
            >


            <label>
                Billing Amount
            </label>

            <input
                type="number"
                id="itemBillingAmount"
                placeholder="ENTER BILLING AMOUNT"
                min="0"
                step="0.01"
            >


            <label>
                Incentive Amount
                <small style="font-weight:normal;">
                    (Optional)
                </small>
            </label>

            <input
                type="number"
                id="itemIncentiveAmount"
                placeholder="ENTER INCENTIVE AMOUNT (OPTIONAL)"
                min="0"
                step="0.01"
            >


            <button onclick="saveItem()">
                Save Item Code
            </button>

        </div>


        <br>


        <!-- ==========================================
             SEARCH
        =========================================== -->

        <input
            type="text"
            id="searchItem"
            placeholder="Search Item Code or Description"
        >


        <div
            id="itemMessage"
            style="
                color:red;
                font-weight:bold;
                margin-top:5px;
            "
        ></div>


        <br><br>


        <!-- ==========================================
             ITEM TABLE
        =========================================== -->

        <table id="itemTable">

            <tr>

                <th>Item Code</th>
                <th>Description</th>
                <th>Billing Amount</th>
                <th>Incentive Amount</th>
                <th>Status</th>
                <th>Edit</th>
                <th>Edit Billing</th>
                <th>Edit Incentive</th>
                <th>Action</th>
                <th>Delete</th>

            </tr>

        </table>

    </div>

</div>


<!-- ==========================================
     FIREBASE
========================================== -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>


<!-- ==========================================
     COMMON FILES
========================================== -->

<script src="../../js/common/firebase.js"></script>

<script src="../../js/common/admin-common.js"></script>

<script src="../../js/admin/item.js?v=5"></script>


</body>

</html>
